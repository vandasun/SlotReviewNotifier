server:
  port: ${PORT:10000}

spring:
  application:
    name: slot-monitor

app:
  telegram:
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    chat-id: ${TELEGRAM_CHAT_ID:}
  school:
    graphql-url: https://platform.21-school.ru/services/graphql
    organization-id: ${ORGANIZATION_ID:b4b36a53-d253-4840-9000-49061d74bf50}
    token-id: ${TOKEN_ID:${SCHOOL_TOKEN_ID:}}
    jsessionid: ${JSESSIONID:${SCHOOL_JSESSIONID:}}
    task-id: ${TASK_ID:1361446}
  monitor:
    check-interval: ${CHECK_INTERVAL:30000}
    days-back: ${DAYS_BACK:7}
    days-forward: ${DAYS_FORWARD:30}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %5p - %msg%n"
  level:
    root: INFO
    com.slotmonitor: INFO
